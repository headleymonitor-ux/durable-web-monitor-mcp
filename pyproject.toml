[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "durable-web-monitor-mcp"
version = "0.1.0"
description = "Durable website-change monitoring with direct HTTPS and isolated Playwright MCP adapters."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "headleymonitor-ux" }]
dependencies = [
  "mcp>=2,<3",
]

[project.scripts]
dwm = "durable_web_monitor.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/durable_web_monitor"]
